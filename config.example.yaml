# Strategy: "update" (default) creates or updates resources.
#           "create" only creates if missing, skips existing.
# Set globally or per topic (topic strategy overrides global).
# strategy: "update"

# Connection details. All sub-fields are optional in YAML — when empty, the
# legacy environment variables fill in (REDPANDA_BROKERS, REDPANDA_SASL_*,
# REDPANDA_TLS_ENABLED, SCHEMA_REGISTRY_*). Use ${VAR} or ${VAR:-default}
# inside any string to inject env values explicitly.
#
# broker:
#   addresses:
#     - redpanda:9092
#   sasl:
#     mechanism: SCRAM-SHA-256          # or SCRAM-SHA-512
#     username: ${REDPANDA_ADMIN_USERNAME}
#     password: ${REDPANDA_ADMIN_PASSWORD}
#   tls:
#     enabled: false
#
# schema_registry:
#   url: http://redpanda:8081
#   username: ${SR_USERNAME:-}
#   password: ${SR_PASSWORD:-}

topics:
  - name: orders
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: "259200000"
      cleanup.policy: delete
      min.insync.replicas: "2"
      compression.type: zstd

  - name: user-state
    partitions: 6
    replication_factor: 3
    config:
      cleanup.policy: compact
      min.insync.replicas: "2"

schemas:
  - subject: orders-value
    type: avro
    file: schemas/orders.avsc
    compatibility: BACKWARD

users:
  - username: orders-service
    password: ${ORDERS_SERVICE_PASSWORD}
    mechanism: SCRAM-SHA-256

acls:
  - principal: "User:orders-service"
    operations: [write, describe]
    resource_type: topic
    resource_name: orders
    pattern: literal
    permission: allow

  - principal: "User:orders-service"
    operations: [read, describe]
    resource_type: group
    resource_name: order-processors
    pattern: literal
    permission: allow

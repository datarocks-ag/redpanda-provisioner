# Strategy applies to topics only (schemas, users and ACLs are always upserted).
#   "update" (default) creates missing topics and updates existing ones.
#   "create" only creates missing topics and skips existing ones.
# Set globally or per topic (topic strategy overrides global).
# strategy: "update"

# Connection details. All sub-fields are optional in YAML — when empty, the
# legacy environment variables fill in (REDPANDA_BROKERS, REDPANDA_SASL_*,
# REDPANDA_TLS_ENABLED, SCHEMA_REGISTRY_*). Use ${VAR} or ${VAR:-default}
# inside any string to inject env values explicitly.
#
# broker:
#   addresses:
#     - redpanda:9092
#   sasl:
#     mechanism: SCRAM-SHA-256          # or SCRAM-SHA-512
#     username: ${REDPANDA_ADMIN_USERNAME}
#     password: ${REDPANDA_ADMIN_PASSWORD}
#   tls:
#     enabled: false
#
# schema_registry:
#   url: http://redpanda:8081
#   username: ${SR_USERNAME:-}
#   password: ${SR_PASSWORD:-}

topics:
  - name: orders
    partitions: 6
    replication_factor: 1         # the bundled docker-compose.yaml runs one broker; use 3 in production
    config:
      retention.ms: "259200000"
      cleanup.policy: delete
      min.insync.replicas: "1"     # keep at or below replication_factor; use 2 with replication_factor 3
      compression.type: zstd

  - name: user-state
    partitions: 6
    replication_factor: 1
    config:
      cleanup.policy: compact
      min.insync.replicas: "1"

schemas:
  - subject: orders-value
    type: avro
    file: schemas/orders.avsc   # relative to this file's directory
    compatibility: BACKWARD

users:
  - username: orders-service
    password: ${ORDERS_SERVICE_PASSWORD}
    mechanism: SCRAM-SHA-256      # required: SCRAM-SHA-256 | SCRAM-SHA-512
    # iterations: 4096            # PBKDF2 iterations; 0 or unset means 4096 (the minimum)

acls:
  - principal: "User:orders-service"
    operations: [write, describe]
    resource_type: topic
    resource_name: orders
    pattern: literal
    permission: allow

  - principal: "User:orders-service"
    operations: [read, describe]
    resource_type: group
    resource_name: order-processors
    pattern: literal
    permission: allow
